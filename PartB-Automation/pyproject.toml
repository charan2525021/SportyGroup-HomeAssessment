[tool.pyright]
include = ["api", "controller", "lib", "page", "tests", "utility", "conftest.py"]
exclude = ["**/__pycache__", "**/.pytest_cache", "**/.venv"]
extraPaths = ["."]
pythonVersion = "3.10"
pythonPlatform = "Windows"
useLibraryCodeForTypes = true
reportMissingImports = "warning"
reportMissingTypeStubs = "none"

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = [
    "ui: end-to-end UI tests driven through Selenium.",
    "api: HTTP-level tests against the sports betting API.",
    "critical: highest priority scenarios protected by automation.",
    "smoke: quick sanity checks against the deployed environment.",
]
